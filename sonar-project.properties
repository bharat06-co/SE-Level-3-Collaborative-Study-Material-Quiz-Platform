sonar.projectKey=study-platform-nfr005-local
sonar.projectName=Collaborative Study Material and Quiz Platform - NFR005
sonar.projectVersion=0.1.0-part3
sonar.sourceEncoding=UTF-8
sonar.sources=server/src,client/src
sonar.tests=server/tests,client/tests
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**
# Native Jest inputs; the included runner overrides this with SF-normalized copies.
# Use the runner for a root-level monorepo scan, especially with Windows LCOV.
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,client/coverage/lcov.info
sonar.scm.disabled=true
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
