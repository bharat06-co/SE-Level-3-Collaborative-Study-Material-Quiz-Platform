name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation-checks:
    name: Lint, unit tests and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # Node 24; working deviation DEV-04
          cache: npm
      - name: Confirm runtime
        run: |
          node --version
          npm --version
      - run: npm ci
      - run: npm run check
      - name: Audit runtime dependencies
        run: npm run audit:runtime
      - name: Save coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: |
            server/coverage/
            client/coverage/
          if-no-files-found: warn
          retention-days: 14
