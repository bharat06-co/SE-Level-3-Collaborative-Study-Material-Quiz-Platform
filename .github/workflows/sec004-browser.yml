name: SEC-004 browser acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/sec004-browser.yml'
      - 'scripts/sec004-browser-acceptance.cjs'
      - 'scripts/sec004-fixture-server.cjs'
      - 'server/src/**'
      - 'client/src/**'
      - 'docs/SEC004_ACCEPTANCE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sec004-browser:
    name: Actual app security checks in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Install temporary browser runner (no committed dependency changes)
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium and required OS libraries
        run: npx playwright install --with-deps chromium
      - name: Exercise real authentication, comments and XSS/NoSQL boundaries
        run: node scripts/sec004-browser-acceptance.cjs
      - name: Preserve acceptance results and browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec004-chromium-evidence
          path: test-results/sec004/
          if-no-files-found: warn
          retention-days: 14
